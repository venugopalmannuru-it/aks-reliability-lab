apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reliability-api
  namespace: reliability-lab
  labels:
    app.kubernetes.io/name: reliability-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reliability-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  egress: []
