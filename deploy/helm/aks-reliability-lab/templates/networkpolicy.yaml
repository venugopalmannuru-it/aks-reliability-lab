{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aks-reliability-lab.fullname" . }}
  labels:
    {{- include "aks-reliability-lab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aks-reliability-lab.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.allowSameNamespace }}
        - podSelector: {}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringPodLabels | nindent 14 }}
      ports:
        - port: {{ .Values.config.port | int }}
          protocol: TCP
  egress: []
{{- end }}
