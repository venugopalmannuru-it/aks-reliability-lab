apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aks-reliability-lab.fullname" . }}
  labels:
    {{- include "aks-reliability-lab.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PORT: {{ .Values.config.port | quote }}
  SHUTDOWN_DELAY: {{ .Values.config.shutdownDelay | quote }}
  SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}
