config:
  environment: production
  logLevel: INFO

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 192Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

minReadySeconds: 15

serviceMonitor:
  enabled: false
