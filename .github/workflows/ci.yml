name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Compile
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/platform-api ./cmd/api

  manifests:
    name: Kubernetes and Helm validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v4.1.3
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.2
      - name: Helm lint
        run: make helm-lint
      - name: Render Helm profiles
        run: |
          helm template development deploy/helm/aks-reliability-lab -f deploy/helm/aks-reliability-lab/values-development.yaml > /tmp/development.yaml
          helm template production deploy/helm/aks-reliability-lab -f deploy/helm/aks-reliability-lab/values-production.yaml > /tmp/production.yaml
      - name: Render raw manifests
        run: kubectl kustomize deploy/kubernetes/base > /tmp/kustomize.yaml
      - name: Schema validation
        run: |
          docker run --rm -v /tmp:/manifests ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.35.0 \
            /manifests/development.yaml /manifests/production.yaml /manifests/kustomize.yaml

  container-security:
    name: Container and security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: aks-reliability-lab:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      - name: Exercise container health check
        run: |
          docker run -d --name reliability-ci --read-only --cap-drop=ALL --security-opt=no-new-privileges:true -p 18080:8080 aks-reliability-lab:ci
          trap 'docker rm -f reliability-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/readyz; then exit 0; fi
            echo "readiness attempt ${attempt}/20 failed"
            sleep 1
          done
          docker logs reliability-ci
          exit 1
      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aks-reliability-lab:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
